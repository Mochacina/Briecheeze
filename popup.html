<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Briecheeze v1.1(250810)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="images/icon48.png" alt="Briecheeze Icon" class="icon">
      <h1>Briecheeze V1.1</h1>
    </div>
    <p class="status-text">치지직 그리드/광고 보호 by Brie</p>
    <div class="toggle-container">
      <span class="toggle-label-off">OFF</span>
      <label class="switch">
        <input type="checkbox" id="toggleSwitch">
        <span class="slider round"></span>
      </label>
      <span class="toggle-label-on">ON</span>
    </div>
    <div class="settings-container">
      <button id="settingsBtn" class="settings-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
  </div>
  <div id="advancedSettings" class="advanced-settings">
    <div class="setting-item">
        <label for="autoQualitySwitch">자동 화질 설정</label>
        <label class="switch">
            <input type="checkbox" id="autoQualitySwitch">
            <span class="slider round"></span>
        </label>
    </div>
    <div class="setting-item">
        <label for="adPopupSwitch">광고 팝업 제거</label>
        <label class="switch">
            <input type="checkbox" id="adPopupSwitch">
            <span class="slider round"></span>
        </label>
    </div>
    <div class="setting-item">
        <label for="autoUnmuteSwitch">자동 음소거 해제</label>
        <label class="switch">
            <input type="checkbox" id="autoUnmuteSwitch">
            <span class="slider round"></span>
        </label>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
